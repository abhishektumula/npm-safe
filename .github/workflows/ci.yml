# Contributor gates (AGENTS.md): typecheck, tests with the >=90% coverage
# gate, and a dependency audit. Green CI means the set is safe to commit.
# The node-compat job proves the published bundle runs on every supported
# Node, not just Bun.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run format:check
      - run: bun test --coverage
      # braces GHSA-vfj7-8cjw-p6xm has no published fix (transitive via
      # micromatch in @yarnpkg/*); ignore only that advisory so new vulns still fail.
      - run: bun audit --ignore GHSA-vfj7-8cjw-p6xm
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  node-compat:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        node: [18, 20, 22]
    steps:
      # Checkout supplies package.json ("type": "module"): Node 18 and 20.x
      # before ESM detection only treat dist/index.js as ESM when a package.json
      # above it says so, exactly like the published package layout.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Offline smoke: no network, no installs.
      - run: node dist/index.js --version
      - run: node dist/index.js --help
      - run: node dist/index.js completions bash
      - run: node dist/index.js alias
