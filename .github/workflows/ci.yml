# Contributor gates (AGENTS.md): typecheck, tests with the >=90% coverage
# gate, and a dependency audit. Green CI means the set is safe to commit.
# The node-compat job proves the published bundle runs on every supported
# Node, not just Bun.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run format:check
      - run: bun test --coverage
      # Ignored (reviewed 2026-11-13, both moderate, transitive via
      # @npmcli/arborist; no in-range fix — arborist 10 still pins
      # minimatch ^10 and requires Node >=22.22, dropping our Node 20):
      #   GHSA-g3hv-75wg-m249 minimatch ReDoS — needs an attacker-chosen glob;
      #     ours come from the user's own `workspaces` / TUF metadata.
      #   GHSA-3g3m-2fjr-6pw4 glob AbortSignal bypass — only matters when a
      #     caller cancels glob via signal; cacache never does.
      # Drop these when moving to arborist 10 / cacache 21.
      - run: bun audit --ignore=GHSA-g3hv-75wg-m249 --ignore=GHSA-3g3m-2fjr-6pw4
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3

  node-compat:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        node: [20, 22]
    steps:
      # Checkout supplies package.json ("type": "module") and the runtime
      # dependencies are installed, exactly like the published package layout
      # (dist/ holds only our code; dependencies stay external).
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      # Offline smoke: no network.
      - run: node dist/index.js --version
      - run: node dist/index.js --help
      - run: node dist/index.js completions bash
      - run: node dist/index.js alias
